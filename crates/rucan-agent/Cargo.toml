[package]
name = "rucan-agent"
version = "0.1.6"
edition = "2024"
license = "Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
nix = { version = "0.28", features = ["fs", "process", "user"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt", "signal", "sync", "macros", "io-util", "net", "time", "process"] }
uuid = { version = "1", features = ["v4"] }
vt100 = "0.18"

[dev-dependencies]
tempfile = "3"
